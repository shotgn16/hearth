name: Hearth
version: "1.4.0"
slug: hearth
description: Household money manager with bank sync, budgets, forecasts and local AI (Ollama)
url: "https://github.com/shotgn16/hearth"
# Ready-made image built by .github/workflows/addon-image.yml — Home Assistant downloads it instead of building it.
image: "ghcr.io/shotgn16/hearth-{arch}"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true

# Opens in the Home Assistant sidebar. You're signed in as your HA user automatically.
ingress: true
ingress_port: 8484
panel_icon: mdi:home-currency-usd
panel_title: Hearth

# Lets Hearth send notifications through your HA notify services, read your HA calendars,
# and publish sensors (free to spend, month spending…) — no tokens to paste.
homeassistant_api: true
# Read-only access to its own add-on info (to link notifications back to the sidebar panel)
hassio_api: true
hassio_role: default

# Optional direct port for installing the app on phones outside the HA app. Off until you set a port.
ports:
  8484/tcp: null
ports_description:
  8484/tcp: Direct web access (optional — the sidebar panel works without it)

backup: hot
backup_pre: "wget -qO- http://127.0.0.1:8484/internal/checkpoint"

# Everything else is set inside Hearth: Settings → App settings and Settings → Local AI.
options: {}
schema: {}
